name: Deploy to zentrading.ai

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan hosting05.layerip.com >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude 'deploy.sh' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            futurepr@hosting05.layerip.com:/home/futurepr/zentrading.ai/
